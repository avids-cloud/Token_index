name: Task
description: A non-story task (setup, housekeeping, a decision to make)
title: "Task: "
body:
  - type: textarea
    id: what
    attributes:
      label: What needs doing
      description: Plain English. Say who can do it if it needs a human.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: How we know it is done
      placeholder: "- ..."
    validations:
      required: true
