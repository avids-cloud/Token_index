name: Story
description: A user story with acceptance criteria you can observe in a browser
title: "Story: "
labels: ["story"]
body:
  - type: textarea
    id: story
    attributes:
      label: Story
      description: Who wants what, and why.
      placeholder: "As a [user], I want [thing], so that [outcome]."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: >
        Each criterion must be observable in the running product, not by
        reading code. One per line.
      placeholder: |
        - Given [state], when [action], then [observable result]
        - Edge case: given [unusual state], when [action], then [observable result]
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this story deliberately does not include.
      placeholder: "- ..."
  - type: input
    id: spec
    attributes:
      label: Spec
      description: Path of the spec this story comes from, if any.
      placeholder: docs/product/specs/example.md
  - type: markdown
    attributes:
      value: >
        **Done when: all criteria demonstrated to me in the running
        product.** Tests are written from these criteria before the feature
        code, and only Avi's confirmation closes this story.
